name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-slim

    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Lint markdown
        uses: DavidAnson/markdownlint-cli2-action@v23
