name: Bug report
description: Something works differently than it should.
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you saw, and what you expected to see instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The smallest set of steps that shows the problem.
      placeholder: |
        1. Go to ...
        2. Select ...
        3. See ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The package version, release, or commit you're using, if you know it.
  - type: textarea
    id: context
    attributes:
      label: Anything else
      description: Logs, screenshots, browser or runtime, and anything else that helps.
